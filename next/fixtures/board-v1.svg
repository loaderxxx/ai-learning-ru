<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640"><rect width="900" height="640" fill="#f1f3ed"/><rect x="40" y="38" width="820" height="562" rx="24" fill="#fffef9" stroke="#d2dbcc"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#214e40"><text x="82" y="92" font-size="16" letter-spacing="3">УЧЕБНЫЙ ПРИМЕР · АРХИВ</text><text x="82" y="157" font-size="42" font-weight="bold">Встреча мастерской</text><text x="82" y="191" font-size="21" fill="#7c6950">Карточка версии 1 — может быть устаревшей</text><path d="M82 223H818" stroke="#d7ded3"/><text x="82" y="270" font-size="20">Начало</text><text x="420" y="270" font-size="28" font-weight="bold">11:30 · Москва</text><text x="82" y="328" font-size="20">Стоимость</text><text x="420" y="328" font-size="28" font-weight="bold">1 200 ₽</text><text x="82" y="386" font-size="20">Участники</text><text x="420" y="386" font-size="28" font-weight="bold">18 человек</text><text x="82" y="444" font-size="20">Дата</text><text x="420" y="444" font-size="23">Не указана</text><path d="M82 478H818" stroke="#d7ded3"/><text x="82" y="525" font-size="19">Ссылка: у организатора · точного адреса нет</text><text x="82" y="562" font-size="14" fill="#738174">Вымышленная карточка. Не анонс реального события.</text></g></svg>
